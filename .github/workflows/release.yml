name: Erzmark Launcher – Release bauen

# Wird durch einen Release-Tag automatisch ausgelöst und kann zusätzlich
# manuell über den Actions-Tab gestartet werden.
# Baut Windows-, macOS- (Intel + Apple Silicon) und Linux-Installer parallel
# in der Cloud – kein eigener Mac/Linux-Rechner nötig. Legt am Ende einen
# GitHub-Release als Entwurf (Draft) an, den du nach Prüfung manuell
# veröffentlichst.
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'erzmark-launcher-v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1 und neuer)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel-Macs
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux-Systemabhängigkeiten installieren
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Frontend-Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Erzmark Launcher bauen + als Release-Entwurf hochladen
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: erzmark-launcher-v__VERSION__
          releaseName: 'Erzmark Launcher v__VERSION__'
          releaseBody: |
            ## Erzmark Launcher 1.5.1

            Wartungs-Release: Der Spielstart war mit Minecraft 26.2 defekt und
            ist wieder repariert. Dazu ein mitgeliefertes Startpack und mehrere
            Verbesserungen an Skin-Schmiede, Erinnerungen und Gilde.

            ### Behoben

            - **Minecraft startete mit 26.2 nicht mehr.** Beim Zusammenbauen des
              Klassenpfads fielen Bibliotheken mit gleicher Version, aber
              unterschiedlichem Klassifikator auf denselben Schlüssel. Seit
              Minecraft 26.2 liegen die LWJGL-Kernklassen im Artefakt
              `org.lwjgl:lwjgl:3.4.1:unsafe`, das dadurch gegen die zugehörigen
              Natives verdrängt wurde – das Spiel stürzte direkt beim Start mit
              `NoClassDefFoundError: org/lwjgl/system/CallbackI` ab. Der
              Klassifikator gehört jetzt zum Modul-Schlüssel und nicht mehr zur
              Version.
            - **Alte Mods blieben nach einem Versionswechsel liegen.** Der
              verwaltete Mod-Ordner wird vor jedem Datei-Abgleich geleert.
              Bisher blockierten zurückgebliebene Mods der Vorgängerversion den
              Start mit „Incompatible mods found".

            ### Neu

            - **Startpack.** Fabric API, Sodium und Iris werden passend zur
              Spielversion mitgeliefert und automatisch aktuell gehalten –
              Shader funktionieren damit ohne manuelle Installation.
            - **Skin-Schmiede.** Eigener lokaler Skin-Tresor: Skins importieren,
              benennen, durchsuchen und jederzeit wieder anlegen. Skin-Dateien
              werden vor dem Übernehmen auf Format und Variante geprüft.
              Skin-per-URL und Zurücksetzen liegen jetzt unter „Weitere
              Minecraft-Aktionen".
            - **Erinnerungen.** Screenshots lassen sich als Favoriten merken und
              im Vollbild-Karussell inklusive Diaschau durchblättern. Die
              Originaldateien werden erst beim Öffnen geladen, wodurch die
              Galerie deutlich schneller aufgeht.
            - **Gildenrat und Reichskarte** als neue Ansichten im
              Gemeinschafts-Dock, dazu ein Abschiedsbild beim Sprung ins Spiel.

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
